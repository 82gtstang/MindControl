name: Ocean Serenity experimental auto-rig
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/android-landscape-startup]
    paths:
      - 'tools/rig_ocean_serenity.py'
      - '.github/workflows/ocean-serenity-rig.yml'
      - 'tools/preview_ocean_serenity.py'
      - '.github/workflows/unreal-android.yml'
jobs:
  rig:
    runs-on: [self-hosted, Windows, X64, unreal-5-7, android-sdk]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download Ocean Serenity OBJ
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/82gtstang/MindControl/releases/download/ocean-serenity-test/Ocean_Serenity_Blender_Starter.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'OceanSerenityRig'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $dir 'source.zip')
          Expand-Archive -Path (Join-Path $dir 'source.zip') -DestinationPath (Join-Path $dir 'input') -Force
          $obj = Get-ChildItem (Join-Path $dir 'input') -Filter '*.obj' -Recurse -File | Select-Object -First 1
          if (-not $obj) { throw 'No OBJ in Ocean Serenity release ZIP' }
          "OCEAN_OBJ=$($obj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OCEAN_OUTPUT=$(Join-Path $env:GITHUB_WORKSPACE 'rig-output\OceanSerenity.fbx')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Find Blender for skin diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $command = Get-Command blender.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          $valid = @()
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if (!(Test-Path $candidate)) { continue }
            $versionLine = (& $candidate --version 2>&1 | Select-Object -First 1)
            if ($versionLine -match 'Blender (\d+)\.(\d+)') {
              $valid += [pscustomobject]@{Path=$candidate;Major=[int]$Matches[1];Minor=[int]$Matches[2]}
            }
          }
          $blender = $valid | Sort-Object Major,Minor -Descending | Select-Object -First 1 -ExpandProperty Path
          if (-not $blender) { throw 'No Blender installation found on the runner.' }
          Write-Host 'Using existing Blender for skin-weight diagnosis; no download attempted.'
          "BLENDER_EXE=$blender" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $blender --version
      - name: Generate experimental A-pose FBX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_EXE -b -t 2 --python 'tools/rig_ocean_serenity.py' -- "$env:OCEAN_OBJ" "$env:OCEAN_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "Rigging failed with exit code $LASTEXITCODE" }
          if (!(Test-Path $env:OCEAN_OUTPUT)) { throw 'Rigged FBX was not exported' }
          if ((Get-Item $env:OCEAN_OUTPUT).Length -lt 1024) { throw 'FBX suspiciously small' }
      - name: Upload rigged model and report
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: OceanSerenity-Experimental-Rig-FBX
          path: rig-output/*
          if-no-files-found: error
      - name: Render six animation preview sequences
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_EXE -b -t 2 --python 'tools/preview_ocean_serenity.py' -- "$env:OCEAN_OUTPUT" "$env:GITHUB_WORKSPACE\\rig-preview"
          if ($LASTEXITCODE -ne 0) { throw "Animation preview render failed ($LASTEXITCODE)" }
          $images = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "rig-preview") -Filter *.png -File -ErrorAction SilentlyContinue)
          Write-Host "Preview PNG count: $($images.Count)"
          if ($images.Count -lt 1) { throw "Blender did not generate PNG previews in workspace" }
      - name: Upload animation preview frames
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: OceanSerenity-Animation-Previews
          path: ${{ github.workspace }}/rig-preview/*
          if-no-files-found: error
