name: Build Mind Control 3D (Godot)
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0'
      - name: Install Godot and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          cp -r templates/. ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Configure Android SDK for Godot
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore /tmp/mindcontrol-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/mindcontrol-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Start Android tooling and verify export dependencies
        run: |
          "$ANDROID_HOME/platform-tools/adb" start-server
          ls -lah "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/build-tools"
          ls -lah ~/.local/share/godot/export_templates/4.4.1.stable
          cat ~/.config/godot/editor_settings-4.4.tres
      - name: Import project
        run: godot --headless --path godot --editor --import --quit
      - name: Diagnose Android export configuration
        run: godot --headless --path godot --editor --script res://diagnose_export.gd
      - name: Export APK
        run: |
          mkdir -p godot/build
          godot --headless --verbose --path godot --export-debug Android build/MindControl-3D.apk
          test -s godot/build/MindControl-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MindControl-3D-Android-APK
          path: godot/build/MindControl-3D.apk
