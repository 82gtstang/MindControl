name: Connect Image to Unreal privately
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/android-landscape-startup]
    paths: [.github/workflows/image-worker-private.yml]
permissions:
  contents: read
jobs:
  pair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Install signed Tailscale client and request device sign-in
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'C:\Program Files\Tailscale\tailscale.exe'
          if (!(Test-Path $cli)) {
            $msi = Join-Path $env:RUNNER_TEMP 'tailscale-setup-amd64.msi'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
            $signature = Get-AuthenticodeSignature $msi
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Tailscale') { throw 'Invalid Tailscale installer signature' }
            $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart TS_UNATTENDEDMODE=always" -Wait -PassThru
            if ($install.ExitCode -notin @(0,3010) -or !(Test-Path $cli)) { throw "Tailscale install failed: $($install.ExitCode)" }
          }
          $state = & $cli status --json | ConvertFrom-Json
          $link = ''
          if ($state.BackendState -ne 'Running') {
            $env:TS_LOG_TARGET = 'stderr'
            $ErrorActionPreference = 'Continue'
            $output = (& $cli up --unattended --timeout=15s 2>&1 | Out-String)
            $ErrorActionPreference = 'Stop'
            $state = & $cli status --json | ConvertFrom-Json
            $link = $state.AuthURL
            if (!$link) { $link = [regex]::Match($output,'https://login\.tailscale\.com/[A-Za-z0-9/_?&=.-]+').Value }
            if ($state.BackendState -ne 'Running' -and $link -notmatch '^https://login\.tailscale\.com/') {
              throw "Could not obtain a sign-in URL. Client state: $($state.BackendState)"
            }
          }
          $data = if ($state.BackendState -eq 'Running') { 'already-connected' } else { $link }
          $rsa = New-Object Security.Cryptography.RSACryptoServiceProvider
          try {
            $rsa.FromXmlString('<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>')
            [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'tailscale-pair.enc'),$rsa.Encrypt([Text.Encoding]::UTF8.GetBytes($data),$true))
          } finally { $rsa.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-tailscale-pairing
          path: tailscale-pair.enc
          if-no-files-found: error
          retention-days: 1
      - name: Wait for sign-in and enable private HTTPS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'C:\Program Files\Tailscale\tailscale.exe'
          $state = & $cli status --json | ConvertFrom-Json
          Write-Host "Tailscale backend state in the runner session: $($state.BackendState)"
          if ($state.BackendState -ne 'Running') { throw 'The runner session does not have an active Tailscale connection.' }
          $serveStatus = (& $cli serve status --json | Out-String) | ConvertFrom-Json
          $hostName = $state.Self.DNSName.TrimEnd('.')
          $target = "http://127.0.0.1:8787"
          $web = if ($serveStatus.Web) { $serveStatus.Web.PSObject.Properties["${hostName}:443"] }
          if ($web -and $web.Value.Handlers -and $web.Value.Handlers.'/' -and $web.Value.Handlers.'/'.Proxy -ne $target) {
            throw 'A different HTTPS service is already using the tailnet hostname root.'
          }
          if ($serveStatus.AllowFunnel -and ($serveStatus.AllowFunnel.PSObject.Properties | Where-Object Value -eq $true)) {
            throw 'Existing public Funnel configuration detected. Review it before adding the private worker.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'private-serve.out'
          $errors = Join-Path $env:RUNNER_TEMP 'private-serve.err'
          $serve = Start-Process $cli -ArgumentList @('serve','--bg','--https=443',$target) -NoNewWindow -RedirectStandardOutput $output -RedirectStandardError $errors -PassThru
          if (!$serve.WaitForExit(20000)) {
            Stop-Process -Id $serve.Id -Force
            throw 'Tailscale Serve did not finish within 20 seconds.'
          }
          if ($serve.ExitCode -ne 0) {
            $details = (Get-Content $output,$errors -Raw -ErrorAction SilentlyContinue) -join ' '
            $details = $details -replace 'https?://[^\s]+','[URL redacted]'
            throw "Tailscale Serve setup failed: $details"
          }
          $verified = $false
          try {
            Invoke-WebRequest -Uri "https://$hostName/generate-unreal" -Method Post -UseBasicParsing -TimeoutSec 25 | Out-Null
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401) { $verified = $true }
          }
          if (!$verified) { throw 'Private HTTPS endpoint did not return the expected authentication challenge.' }
          $rsa = New-Object Security.Cryptography.RSACryptoServiceProvider
          try {
            $rsa.FromXmlString('<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>')
            [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'tailscale-endpoint.enc'),$rsa.Encrypt([Text.Encoding]::UTF8.GetBytes("https://$hostName"),$true))
          } finally { $rsa.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-tailscale-endpoint
          path: tailscale-endpoint.enc
          if-no-files-found: error
          retention-days: 1
