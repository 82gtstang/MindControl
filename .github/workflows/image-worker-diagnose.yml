name: Diagnose Image to Unreal worker
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/android-landscape-startup]
    paths: [.github/workflows/image-worker-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Capture worker diagnostics and test a repository reference image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramData 'MindControl-ImageWorker'
          $task = 'MindControl-ImageToUnreal-Worker'
          $key = [IO.File]::ReadAllText((Join-Path $root 'token.txt'))
          Stop-ScheduledTask -TaskName $task
          $configPath = Join-Path $root 'config.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $newBlender = Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse |
            Where-Object { $_.Directory.Name -match '^Blender [\d.]+$' } |
            Sort-Object { [version]($_.Directory.Name -replace '^Blender ','') } -Descending | Select-Object -First 1
          if ($newBlender) { $config.blender = $newBlender.FullName }
          $config | ConvertTo-Json | Set-Content $configPath
          Copy-Item tools/ocean3d/unreal_server.py,tools/ocean3d/run_triposr.py,tools/ocean3d/export_unreal.py -Destination $root -Force
          @'
          $ErrorActionPreference = 'Stop'
          $c = Get-Content (Join-Path $PSScriptRoot 'config.json') -Raw | ConvertFrom-Json
          $env:OCEAN3D_TOKEN = [IO.File]::ReadAllText((Join-Path $PSScriptRoot 'token.txt'))
          $env:OCEAN3D_TRIPOSR = $c.tripo
          $env:OCEAN3D_BLENDER = $c.blender
          $env:PYTHONUNBUFFERED = '1'
          $script = '"' + (Join-Path $PSScriptRoot 'unreal_server.py') + '"'
          $p = Start-Process $c.python -ArgumentList $script -WorkingDirectory $PSScriptRoot -RedirectStandardOutput (Join-Path $PSScriptRoot 'worker.stdout.log') -RedirectStandardError (Join-Path $PSScriptRoot 'worker.stderr.log') -NoNewWindow -PassThru
          $p.WaitForExit()
          exit $p.ExitCode
          '@ | Set-Content (Join-Path $root 'Start-Worker.ps1') -Encoding UTF8
          Start-ScheduledTask -TaskName $task
          $ready = $false
          for ($i=0; $i -lt 20 -and !$ready; $i++) {
            try {
              Invoke-WebRequest 'http://127.0.0.1:8787/generate-unreal' -Method Post -UseBasicParsing -TimeoutSec 3 | Out-Null
            } catch {
              if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401) { $ready = $true }
            }
            if (!$ready) { Start-Sleep 1 }
          }
          try {
            if (!$ready) { throw 'Worker did not restart' }
            $photo = Join-Path $env:GITHUB_WORKSPACE 'assets\ocean3d\serenity-front.jpg'
            $out = Join-Path $env:RUNNER_TEMP 'worker-smoke.zip'
            $state = & 'C:\Program Files\Tailscale\tailscale.exe' status --json | ConvertFrom-Json
            $hostname = $state.Self.DNSName.TrimEnd('.')
            $status = & curl.exe -sS --max-time 600 -o $out -w '%{http_code}' -H ('Authorization: Bearer ' + $key) -F ('image=@' + $photo) "https://$hostname/generate-unreal"
            if ($LASTEXITCODE -ne 0) { throw "HTTPS smoke test curl failed: $LASTEXITCODE" }
            Write-Host "Generation HTTP status: $status"
            if ($status -ne '200') { throw 'Reference image generation failed' }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead($out)
            try {
              if (!$zip.GetEntry('Character.fbx') -or !$zip.GetEntry('Character_BaseColor.png')) { throw 'Output missing the FBX or texture' }
            } finally { $zip.Dispose() }
            Write-Host 'Generated FBX and texture through private HTTPS.'
          } finally {
            foreach ($name in @('worker.stdout.log','worker.stderr.log')) {
              $log = Join-Path $root $name
              if (Test-Path $log) {
                Get-Content $log -Tail 75 | ForEach-Object {
                  $line = $_.Replace($key,'[token redacted]') -replace 'https?://\S+','[URL redacted]'
                  if ($line -notmatch '(?i)authorization|bearer|signedurl|api[_-]?key') { Write-Host $line }
                }
              }
            }
          }
