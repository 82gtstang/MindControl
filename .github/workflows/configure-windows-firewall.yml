name: Configure Windows Firewall for RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-rdp:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Validate server and configure LAN-only RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'MSI') {
            throw "Refusing to modify firewall on unexpected host: $env:COMPUTERNAME"
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Runner service must run elevated to modify Windows Firewall."
          }
          $ruleName = 'Allow RDP from Home LAN'
          $existing = Get-NetFirewallRule -Name 'MindControl-LAN-RDP' -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-NetFirewallRule -Name 'MindControl-LAN-RDP'
          }
          New-NetFirewallRule -Name 'MindControl-LAN-RDP' -DisplayName $ruleName -Enabled True -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress '192.168.1.0/24' -Profile Private
          Get-NetFirewallRule -Name 'MindControl-LAN-RDP' | Format-List Name,Enabled,Direction,Action,Profile
          Get-NetFirewallRule -Name 'MindControl-LAN-RDP' | Get-NetFirewallAddressFilter | Format-List RemoteAddress
          Get-NetFirewallRule -Name 'MindControl-LAN-RDP' | Get-NetFirewallPortFilter | Format-List Protocol,LocalPort
