name: Unreal Engine 5.7 Android APK
on:
  workflow_dispatch:
    inputs:
      play_bundle:
        description: Build a signed Google Play bundle
        type: boolean
        default: false
  push:
    branches: [unreal5-prototype, diagnostic/android-landscape-startup]
    paths:
      - 'assets/ocean3d/OceanSerenity.fbx'
      - 'unreal/**'
      - 'tools/animate_valkyrie.py'
      - 'tools/generate_fantasy_audio.py'
      - 'tools/import_ocean_serenity.py'
      - 'tools/bake_dungeon_assets.py'
      - 'tools/import_townsperson.py'
      - 'tools/rig_ocean_serenity.py'
      - 'tools/preview_ocean_serenity.py'
      - '.github/workflows/ocean-serenity-rig.yml'
      - '.github/workflows/unreal-android.yml'
jobs:
  wait-for-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for successful same-commit rig without occupying Windows runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            response=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ocean-serenity-rig.yml/runs?head_sha=$GITHUB_SHA&per_page=60")
            result=$(echo "$response" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name=="Ocean Serenity experimental auto-rig" and .head_sha==$sha)] | first | if . == null then "missing" else (.status + ":" + (.conclusion // "pending")) end')
            echo "Rig on $GITHUB_SHA: $result ($attempt/120)"
            if [ "$result" = "completed:success" ]; then exit 0; fi
            if [[ "$result" == completed:* ]]; then echo "Rig failed: $result"; exit 1; fi
            sleep 30
          done
          echo "::error::No successful rig for this exact commit after 60 minutes. Check rig workflow triggers and failures; do not treat this as a successful Android build."
          exit 1
  package-android:
    needs: wait-for-rig
    environment: ${{ inputs.play_bundle && 'MindControl' || '' }}
    runs-on: [self-hosted, Windows, X64, unreal-5-7, android-sdk]
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unreal 5.7 and Android toolchain
        shell: powershell
        run: |
          $engine = "C:\Users\82gts\Epic Games\UE_5.7"
          $uat = Join-Path $engine 'Engine\Build\BatchFiles\RunUAT.bat'
          if (!(Test-Path $uat)) { throw "Unreal Engine not found at $engine. Set UE_ROOT as a system environment variable and restart the runner service." }
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          if (!(Test-Path $sdk)) { throw "Android SDK not found at $sdk. Set ANDROID_HOME as a system environment variable accessible to the runner service." }
          "UE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Unreal Engine: $engine"
          Write-Host "Android SDK: $sdk"
      - name: Clear stale project build metadata
        shell: powershell
        run: |
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE 'unreal'
          foreach ($folder in @('Intermediate', 'Binaries', 'PackagedAndroid')) {
            $target = Join-Path $projectRoot $folder
            if (Test-Path $target) {
              Write-Host "Removing generated project folder: $target"
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
            }
          }
      - name: Build Windows editor target for cooking
        shell: powershell
        run: |
          $build = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          & $build MindControlEditor Win64 Development "-Project=$project" -WaitMutex -NoHotReload -NoXGE -MaxParallelActions=1
          if ($LASTEXITCODE -ne 0) { throw "MindControlEditor build failed with exit code $LASTEXITCODE" }
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'unreal\Binaries\Win64\MindControlEditor.target'
          if (!(Test-Path $receipt)) { throw "Editor target receipt missing: $receipt" }
      - name: Download rigged Ocean Serenity FBX from successful rigging build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = 'https://api.github.com/repos/82gtstang/MindControl'
          # The ubuntu-latest wait-for-rig job already validated the matching
          # commit. Do not block the self-hosted Windows runner here.
          $runs = Invoke-RestMethod -Uri "$api/actions/workflows/ocean-serenity-rig.yml/runs?head_sha=$env:GITHUB_SHA&per_page=60" -Headers $headers
          $rig = $runs.workflow_runs | Where-Object {
            $_.name -eq 'Ocean Serenity experimental auto-rig' -and
            $_.head_sha -eq $env:GITHUB_SHA -and
            $_.conclusion -eq 'success'
          } | Select-Object -First 1
          if (-not $rig) { throw "Matching successful rig artifact not found for $env:GITHUB_SHA" }
          $artifacts = Invoke-RestMethod -Uri "$api/actions/runs/$($rig.id)/artifacts" -Headers $headers
          $artifact = $artifacts.artifacts | Where-Object { $_.name -eq 'OceanSerenity-Experimental-Rig-FBX' -and -not $_.expired } | Select-Object -First 1
          if (-not $artifact) { throw "No rigged FBX artifact found in workflow run $($rig.id)" }
          $dir = Join-Path $env:RUNNER_TEMP 'OceanSerenityRigged'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir 'rig.zip'
          Invoke-WebRequest -Uri "$api/actions/artifacts/$($artifact.id)/zip" -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $fbx = Get-ChildItem -Path $dir -Filter '*.fbx' -Recurse | Select-Object -First 1
          if (-not $fbx) { throw 'Rigging artifact contains no FBX' }
          "OCEAN_FBX=$($fbx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using rigged FBX from run $($rig.id): $($fbx.FullName)"
      - name: Import Ocean Serenity skeletal mesh into Unreal project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\import_ocean_serenity.py'
          $log = Join-Path $env:RUNNER_TEMP 'OceanSerenity-UnrealImport.log'
          if (!(Test-Path $editor)) { throw "Unreal Editor missing: $editor" }
          $arguments = @(
            "`"$project`""
            '-run=pythonscript'
            '-Interchange.FeatureFlags.Import.FBX=False'
            "-script=`"$script`""
            '-unattended'
            '-nop4'
            '-nosplash'
            '-nullrhi'
            "-abslog=`"$log`""
          )
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          Write-Host "Unreal Editor exit code: $($process.ExitCode)"
          if (Test-Path $log) {
            Write-Host '=== Unreal FBX import diagnostic lines ==='
            Get-Content $log | Where-Object { $_ -match 'LogPython|LogInterchange|LogWindows: Error|LogAssetTools|LogFbx|Error:|Assertion failed|OCEAN_IMPORT|LogSlate' } | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            Write-Host '=== End of Unreal log ==='
            Get-Content $log -Tail 65 | ForEach-Object { Write-Host $_ }
          } else { Write-Warning "Unreal import log not found: $log" }
          $mesh = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Characters\OceanSerenity\OceanSerenity.uasset'
          if (!(Test-Path $mesh)) { throw "Expected skeletal mesh missing: $mesh" }
          if ((Get-Item $mesh).Length -lt 4096) { throw "Imported skeletal mesh is suspiciously small: $mesh" }
          $animationDir = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Characters\OceanSerenity'
          $missingAnimations = @()
          foreach ($clip in @('Idle','Walk','Run','WalkDiagonal','RunDiagonal','Jump','Attack','Spin')) {
            $asset = Join-Path $animationDir "OceanSerenityOcean_$clip.uasset"
            if (!(Test-Path $asset)) { $missingAnimations += $clip }
          }
          if ($missingAnimations.Count -gt 0) {
            throw "Ocean Serenity animation import incomplete. Missing clips: $($missingAnimations -join ', '). UE 5.7 Interchange post-import crash may be interrupting animation import."
          }
          Write-Host 'Verified all eight imported Valkyrie animation assets on disk.'
          if ($process.ExitCode -ne 0) {
            # UE 5.7 Interchange can assert in Slate/ContentBrowser AFTER saving
            # the mesh. Permit only this specific post-save crash, and let the
            # subsequent Android cook validate whether assets are usable.
            $raw = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
            $saved = $raw.Contains('Moving output files for package: /Game/Characters/OceanSerenity/OceanSerenity') -and $raw.Contains('OceanSerenity.uasset')
            $knownCrash = $raw.Contains('Assertion failed: CurrentApplication.IsValid()') -and $raw.Contains('UnrealEditor-ContentBrowser.dll')
            if (-not ($process.ExitCode -eq 3 -and $saved -and $knownCrash)) {
              throw "Unreal Ocean Serenity import failed with unexpected exit $($process.ExitCode)"
            }
            Write-Warning 'Known UE 5.7 post-save Content Browser assertion detected; mesh file exists. Continuing to cook for asset validation.'
          }
          Write-Host "Ocean Serenity skeletal mesh asset exists: $mesh"
      - name: Import the townsperson mesh
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\import_townsperson.py'
          $log = Join-Path $env:RUNNER_TEMP 'Townsperson-UnrealImport.log'
          $arguments = @(
            "`"$project`""
            '-Interchange.FeatureFlags.Import.FBX=False'
            "-ExecutePythonScript=`"$script`""
            '-unattended'
            '-nop4'
            '-nosplash'
            '-nullrhi'
            "-abslog=`"$log`""
          )
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          $mesh = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Characters\Town\Townsperson.uasset'
          $raw = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          $imported = $process.ExitCode -eq 0 -and $raw.Contains('TOWNSPERSON_IMPORT_SUCCESS')
          $saved = $raw.Contains('Moving output files for package: /Game/Characters/Town/Townsperson') -and $raw.Contains('Townsperson.uasset')
          $knownCrash = $raw.Contains('Assertion failed: CurrentApplication.IsValid()') -and $raw.Contains('UnrealEditor-ContentBrowser.dll')
          $savedBeforeKnownCrash = $process.ExitCode -eq 3 -and $saved -and $knownCrash
          if (!(Test-Path $mesh) -or (Get-Item $mesh).Length -lt 4096 -or !($imported -or $savedBeforeKnownCrash)) {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw "Townsperson import failed with exit code $($process.ExitCode)"
          }
          $settlers = Join-Path (Split-Path $mesh) 'Settlers'
          foreach ($identity in @('Villager','Artisan','Elf','Dwarf','Halfling','Wizard')) {
            foreach ($frame in 0..4) {
              $frameAsset = Join-Path $settlers "$identity$frame.uasset"
              if (!(Test-Path $frameAsset)) { throw "Missing cooked NPC source $frameAsset" }
            }
          }
          if (!$raw.Contains('SETTLEMENT_PEOPLE_IMPORT_SUCCESS')) { throw 'Settlement NPC import did not finish' }
          Write-Host "Verified townsperson and 30 settlement NPC mesh frames"
      - name: Import environment materials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'unreal\Tools\build_environment_materials.py'
          $log = Join-Path $env:RUNNER_TEMP 'MindControl-EnvironmentImport.log'
          $materials = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Environment\MindControl'
          if (Test-Path -LiteralPath $materials) { Remove-Item -LiteralPath $materials -Recurse -Force }
          $arguments = @(
            ('"{0}"' -f $project)
            '-run=pythonscript'
            ('-script="{0}"' -f $script)
            '-ini:Engine:[ConsoleVariables]:Interchange.FeatureFlags.Import.Enable=0'
            '-unattended'
            '-nop4'
            '-nosplash'
            '-nullrhi'
            '-AllowCommandletAudio'
            ('-abslog="{0}"' -f $log)
          )
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          $missing = @('M_Grass','M_CastleStone','M_Cobblestone','M_Dirt','M_River','M_Waterfall','T_Satchel','M_MobileAtmosphereSky') | Where-Object {
            !(Test-Path (Join-Path $materials "$_.uasset"))
          }
          if ($process.ExitCode -ne 0 -or $missing -or !(Test-Path $log) -or !(Select-String -Path $log -Pattern 'MOBILE_SKY_MATERIAL_SUCCESS' -Quiet)) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "Environment material import failed with exit code $($process.ExitCode)"
          }
      - name: Generate and import medieval meshes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $blender = Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$blender) { throw 'Blender not found' }
          $env:MEDIEVAL_ASSET_DIR = Join-Path $env:RUNNER_TEMP 'MedievalAndroid'
          & $blender.FullName -b -t 2 --python-exit-code 1 --python tools/build_medieval_assets.py -- "$env:MEDIEVAL_ASSET_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Medieval mesh generation failed' }
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\import_medieval_assets.py'
          $log = Join-Path $env:RUNNER_TEMP 'MedievalImport.log'
          $arguments = @(
            ('"{0}"' -f $project)
            '-run=pythonscript'
            ('-script="{0}"' -f $script)
            '-Interchange.FeatureFlags.Import.FBX=False'
            '-unattended'
            '-nop4'
            '-nullrhi'
            ('-abslog="{0}"' -f $log)
          )
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $log) -or !(Select-String -Path $log -Pattern 'MEDIEVAL_IMPORT_COMPLETE 20' -Quiet)) {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw "Medieval import failed: $($process.ExitCode)"
          }
      - name: Generate MindControl Android launch artwork
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $dir = Join-Path $env:GITHUB_WORKSPACE 'unreal\Build\Android\res\drawable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bmp = New-Object System.Drawing.Bitmap(1920,1080)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $rect = New-Object System.Drawing.Rectangle(0,0,1920,1080)
          $bg = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, [System.Drawing.Color]::FromArgb(8,13,28), [System.Drawing.Color]::FromArgb(24,66,100), 90)
          $g.FillRectangle($bg,$rect)
          $random = New-Object System.Random(82)
          for ($i=0;$i -lt 180;$i++) {
            $x=$random.Next(0,1920); $y=$random.Next(0,850); $n=$random.Next(1,4)
            $g.FillEllipse([System.Drawing.Brushes]::LightSteelBlue,$x,$y,$n,$n)
          }
          $dark = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(9,17,29))
          foreach ($x in @(150,390,1350,1590)) {
            $g.FillRectangle($dark,$x,590,180,490)
            for ($j=0;$j -lt 3;$j++) { $g.FillRectangle($dark,($x+60*$j),550,35,60) }
          }
          $g.FillRectangle($dark,0,820,1920,260)
          $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(100,100,190,245),3)
          $g.DrawEllipse($pen,710,110,500,500)
          $g.DrawEllipse($pen,730,130,460,460)
          $font = New-Object System.Drawing.Font('Georgia',82,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $small = New-Object System.Drawing.Font('Georgia',24,[System.Drawing.FontStyle]::Regular,[System.Drawing.GraphicsUnit]::Pixel)
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = [System.Drawing.StringAlignment]::Center
          $titleRect = New-Object System.Drawing.RectangleF(360,390,1200,190)
          $g.DrawString('MINDCONTROL',$font,[System.Drawing.Brushes]::Black,(New-Object System.Drawing.RectangleF(364,396,1200,190)),$fmt)
          $g.DrawString('MINDCONTROL',$font,[System.Drawing.Brushes]::LightSteelBlue,$titleRect,$fmt)
          $g.DrawString('A  R E A L M  O F  M A G I C  A N D  S T E E L',$small,[System.Drawing.Brushes]::White,(New-Object System.Drawing.RectangleF(360,590,1200,80)),$fmt)
          $bmp.Save((Join-Path $dir 'downloadimageh.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save((Join-Path $dir 'splashscreen_landscape.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

      - name: Build and package Android APK
        timeout-minutes: 35
        if: inputs.play_bundle != true
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $output = Join-Path $env:GITHUB_WORKSPACE 'unreal\PackagedAndroid'
          if (!(Test-Path $project)) { throw "Unreal project not found: $project" }
          & $uat BuildCookRun -project="$project" -noP4 -platform=Android -clientconfig=Development -nocompileeditor -unattended -build -NoXGE -cook -AdditionalCookerOptions="-noxgeshadercompile" -CookDir="$env:GITHUB_WORKSPACE\unreal\Content\Environment\MindControl" -stage -pak -package -archive -archivedirectory="$output" -utf8output
          if ($LASTEXITCODE -ne 0) { throw "Unreal BuildCookRun failed with exit code $LASTEXITCODE" }
      - name: Build and verify signed Google Play bundle
        if: inputs.play_bundle == true
        shell: powershell
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('PLAY_UPLOAD_KEYSTORE', 'PLAY_UPLOAD_STORE_PASSWORD', 'PLAY_UPLOAD_KEY_ALIAS', 'PLAY_UPLOAD_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Configure the $name GitHub Actions secret for the Play build."
            }
          }
          if (!(Test-Path (Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'))) {
            throw 'Install Android SDK Platform 36 on the Windows runner.'
          }
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $output = Join-Path $env:GITHUB_WORKSPACE 'unreal\PackagedAndroid'
          $config = Join-Path $env:GITHUB_WORKSPACE 'unreal\Config\DefaultEngine.ini'
          $key = Join-Path $env:GITHUB_WORKSPACE 'unreal\Build\Android\MindControlPlayUpload.keystore'
          $original = [IO.File]::ReadAllBytes($config)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          if (Test-Path $key) { throw 'The temporary Play keystore filename is already in use.' }
          try {
            New-Item -ItemType Directory -Path (Split-Path $key) -Force | Out-Null
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:PLAY_UPLOAD_KEYSTORE))
            $ini = $utf8.GetString($original)
            if ($ini -notmatch '(?m)^TargetSDKVersion=\d+') { throw 'Android target SDK setting is missing.' }
            $ini = $ini -replace '(?m)^TargetSDKVersion=\d+', 'TargetSDKVersion=36'
            $ini += @"

          [/Script/AndroidPlatformEditor.AndroidSDKSettings]
          SDKAPILevel=android-36

          [/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
          bEnableBundle=True
          KeyStore=MindControlPlayUpload.keystore
          KeyAlias=$env:PLAY_UPLOAD_KEY_ALIAS
          KeyStorePassword=$env:PLAY_UPLOAD_STORE_PASSWORD
          KeyPassword=$env:PLAY_UPLOAD_KEY_PASSWORD
          "@
            [IO.File]::WriteAllText($config, $ini, $utf8)
            & $uat BuildCookRun -project="$project" -noP4 -platform=Android -clientconfig=Shipping -distribution -nocompileeditor -unattended -build -cook -CookDir="$env:GITHUB_WORKSPACE\unreal\Content\Environment\MindControl" -stage -pak -package -archive -archivedirectory="$output" -utf8output
            if ($LASTEXITCODE -ne 0) { throw "Unreal Play bundle build failed with exit code $LASTEXITCODE" }
            $bundles = @(Get-ChildItem -LiteralPath $output -Filter '*.aab' -Recurse)
            if ($bundles.Count -ne 1) { throw "Expected one Play bundle, found $($bundles.Count)." }
            $jarsigner = if ($env:JAVA_HOME) { Join-Path $env:JAVA_HOME 'bin\jarsigner.exe' } else { (Get-Command jarsigner.exe).Source }
            $verification = & $jarsigner '-J-Duser.language=en' -verify $bundles[0].FullName
            if ($LASTEXITCODE -ne 0 -or $verification -notcontains 'jar verified.') { throw 'Play bundle signature verification failed.' }
          } finally {
            [IO.File]::WriteAllBytes($config, $original)
            if (Test-Path $key) { Remove-Item -LiteralPath $key -Force }
            $gradle = Join-Path $env:GITHUB_WORKSPACE 'unreal\Intermediate\Android'
            if (Test-Path $gradle) { Remove-Item -LiteralPath $gradle -Recurse -Force }
          }
      - name: Upload signed Google Play bundle
        if: inputs.play_bundle == true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Google-Play-AAB
          path: unreal/PackagedAndroid/**/*.aab
          if-no-files-found: error
      - name: Preserve Unreal build logs on failure
        if: failure() && inputs.play_bundle != true
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'unreal-build-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $root = Join-Path $env:APPDATA 'Unreal Engine\AutomationTool\Logs'
          if (Test-Path $root) {
            Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.txt', '.log') } | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart([char]92)
              $destination = Join-Path $diagnostics $relative
              New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }
          }
          # Preserve UnrealEditor-Cmd logs that are outside AutomationTool's log tree.
          foreach ($fileName in @('Townsperson-UnrealImport.log', 'MindControl-EnvironmentImport.log', 'MedievalImport.log')) {
            $source = Join-Path $env:RUNNER_TEMP $fileName
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $diagnostics $fileName) -Force
            }
          }
      - name: Upload Unreal diagnostic logs
        if: failure() && inputs.play_bundle != true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Build-Logs
          path: unreal-build-diagnostics/**
          if-no-files-found: warn
      - name: Verify APK exists
        if: inputs.play_bundle != true
        shell: powershell
        run: |
          $apks = @(Get-ChildItem -Path 'unreal\PackagedAndroid' -Filter '*.apk' -Recurse -ErrorAction SilentlyContinue)
          if ($apks.Count -eq 0) { throw 'No APK was produced.' }
          $apks | ForEach-Object { Write-Host $_.FullName }
      - name: Check GitHub artifact storage DNS
        if: inputs.play_bundle != true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($hostName in @('results-receiver.actions.githubusercontent.com', 'productionresultssa13.blob.core.windows.net')) {
            $resolved = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $addresses = [System.Net.Dns]::GetHostAddresses($hostName)
                if ($addresses.Count -gt 0) {
                  Write-Host "$hostName resolves to $($addresses[0])"
                  $resolved = $true
                  break
                }
              } catch {
                Write-Warning "DNS attempt $attempt for $hostName failed: $_"
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $resolved) { Write-Warning "DNS still unavailable for $hostName; artifact upload may fail. Check runner DNS, firewall, and proxy." }
          }
      - name: Upload Android APK
        if: inputs.play_bundle != true
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Android-APK
          path: unreal/PackagedAndroid/**/*.apk
          if-no-files-found: error
      - name: Retry Android APK upload after network failure
        if: steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Android-APK-Retry
          path: unreal/PackagedAndroid/**/*.apk
          if-no-files-found: error

