name: Unreal Engine 5.7 Android APK
on:
  workflow_dispatch:
  push:
    branches: [unreal5-prototype, diagnostic/android-landscape-startup]
    paths:
      - 'unreal/**'
      - 'tools/rig_ocean_serenity.py'
      - 'tools/import_ocean_serenity.py'
      - '.github/workflows/unreal-android.yml'
jobs:
  package-android:
    runs-on: [self-hosted, Windows, X64, unreal-5-7, android-sdk]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unreal 5.7 and Android toolchain
        shell: powershell
        run: |
          $engine = "C:\Users\82gts\Epic Games\UE_5.7"
          $uat = Join-Path $engine 'Engine\Build\BatchFiles\RunUAT.bat'
          if (!(Test-Path $uat)) { throw "Unreal Engine not found at $engine. Set UE_ROOT as a system environment variable and restart the runner service." }
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          if (!(Test-Path $sdk)) { throw "Android SDK not found at $sdk. Set ANDROID_HOME as a system environment variable accessible to the runner service." }
          "UE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Unreal Engine: $engine"
          Write-Host "Android SDK: $sdk"
      - name: Clear stale project build metadata
        shell: powershell
        run: |
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE 'unreal'
          foreach ($folder in @('Intermediate', 'Binaries', 'PackagedAndroid')) {
            $target = Join-Path $projectRoot $folder
            if (Test-Path $target) {
              Write-Host "Removing generated project folder: $target"
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
            }
          }
      - name: Download and inspect Ocean Serenity source model
        shell: powershell
        run: |
          $url = 'https://github.com/82gtstang/MindControl/releases/download/ocean-serenity-test/Ocean_Serenity_Blender_Starter.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'OceanSerenitySource'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $archive = Join-Path $dir 'Ocean_Serenity_Blender_Starter.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $dir 'Extracted') -Force
          $models = @(Get-ChildItem (Join-Path $dir 'Extracted') -Recurse -File -Filter '*.obj')
          if ($models.Count -eq 0) { throw 'Ocean Serenity release does not contain an OBJ mesh.' }
          $models | ForEach-Object { Write-Host "Source model: $($_.FullName) ($($_.Length) bytes)" }
          Write-Host 'Source verified. OBJ is not yet an imported/cooked Unreal skeletal mesh.'
      - name: Build Windows editor target for cooking
        shell: powershell
        run: |
          $build = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          & $build MindControlEditor Win64 Development "-Project=$project" -WaitMutex -NoHotReload -NoXGE -MaxParallelActions=1
          if ($LASTEXITCODE -ne 0) { throw "MindControlEditor build failed with exit code $LASTEXITCODE" }
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'unreal\Binaries\Win64\MindControlEditor.target'
          if (!(Test-Path $receipt)) { throw "Editor target receipt missing: $receipt" }
      - name: Download rigged Ocean Serenity FBX from successful rigging build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = 'https://api.github.com/repos/82gtstang/MindControl'
          # Wait for the rig build from THIS commit, never reuse an older FBX.
          $rig = $null
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $runs = Invoke-RestMethod -Uri "$api/actions/runs?per_page=60" -Headers $headers
            $rig = $runs.workflow_runs | Where-Object {
              $_.name -eq 'Ocean Serenity experimental auto-rig' -and
              $_.head_sha -eq $env:GITHUB_SHA -and
              $_.head_branch -eq 'diagnostic/android-landscape-startup'
            } | Select-Object -First 1
            if ($rig -and $rig.status -eq 'completed') { break }
            Write-Host "Waiting for rig workflow on commit $env:GITHUB_SHA ($attempt/90)"
            Start-Sleep -Seconds 30
          }
          if (-not $rig -or $rig.conclusion -ne 'success') {
            throw "Matching Ocean Serenity rig workflow did not succeed for $env:GITHUB_SHA (status=$($rig.status), result=$($rig.conclusion)). Refusing stale FBX."
          }
          $artifacts = Invoke-RestMethod -Uri "$api/actions/runs/$($rig.id)/artifacts" -Headers $headers
          $artifact = $artifacts.artifacts | Where-Object { $_.name -eq 'OceanSerenity-Experimental-Rig-FBX' -and -not $_.expired } | Select-Object -First 1
          if (-not $artifact) { throw "No rigged FBX artifact found in workflow run $($rig.id)" }
          $dir = Join-Path $env:RUNNER_TEMP 'OceanSerenityRigged'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir 'rig.zip'
          Invoke-WebRequest -Uri "$api/actions/artifacts/$($artifact.id)/zip" -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $fbx = Get-ChildItem -Path $dir -Filter '*.fbx' -Recurse | Select-Object -First 1
          if (-not $fbx) { throw 'Rigging artifact contains no FBX' }
          "OCEAN_FBX=$($fbx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using rigged FBX from run $($rig.id): $($fbx.FullName)"
      - name: Import Ocean Serenity skeletal mesh into Unreal project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\import_ocean_serenity.py'
          $log = Join-Path $env:RUNNER_TEMP 'OceanSerenity-UnrealImport.log'
          if (!(Test-Path $editor)) { throw "Unreal Editor missing: $editor" }
          $arguments = @(
            "`"$project`""
            '-run=pythonscript'
            '-Interchange.FeatureFlags.Import.FBX=False'
            "-script=`"$script`""
            '-unattended'
            '-nop4'
            '-nosplash'
            '-nullrhi'
            "-abslog=`"$log`""
          )
          $process = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
          Write-Host "Unreal Editor exit code: $($process.ExitCode)"
          if (Test-Path $log) {
            Write-Host '=== Unreal FBX import diagnostic lines ==='
            Get-Content $log | Where-Object { $_ -match 'LogPython|LogInterchange|LogWindows: Error|LogAssetTools|LogFbx|Error:|Assertion failed|OCEAN_IMPORT|LogSlate' } | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            Write-Host '=== End of Unreal log ==='
            Get-Content $log -Tail 65 | ForEach-Object { Write-Host $_ }
          } else { Write-Warning "Unreal import log not found: $log" }
          $mesh = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Characters\OceanSerenity\OceanSerenity.uasset'
          if (!(Test-Path $mesh)) { throw "Expected skeletal mesh missing: $mesh" }
          if ((Get-Item $mesh).Length -lt 4096) { throw "Imported skeletal mesh is suspiciously small: $mesh" }
          $animationDir = Join-Path $env:GITHUB_WORKSPACE 'unreal\Content\Characters\OceanSerenity'
          $missingAnimations = @()
          foreach ($clip in @('Idle','Walk','Run','Jump','Attack','Spin')) {
            $asset = Join-Path $animationDir "OceanSerenityOcean_$clip.uasset"
            if (!(Test-Path $asset)) { $missingAnimations += $clip }
          }
          if ($missingAnimations.Count -gt 0) {
            throw "Ocean Serenity animation import incomplete. Missing clips: $($missingAnimations -join ', '). UE 5.7 Interchange post-import crash may be interrupting animation import."
          }
          Write-Host 'Verified all six imported Ocean Serenity animation assets on disk (Interchange names).'
          if ($process.ExitCode -ne 0) {
            # UE 5.7 Interchange can assert in Slate/ContentBrowser AFTER saving
            # the mesh. Permit only this specific post-save crash, and let the
            # subsequent Android cook validate whether assets are usable.
            $raw = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
            $saved = $raw.Contains('Moving output files for package: /Game/Characters/OceanSerenity/OceanSerenity') -and $raw.Contains('OceanSerenity.uasset')
            $knownCrash = $raw.Contains('Assertion failed: CurrentApplication.IsValid()') -and $raw.Contains('UnrealEditor-ContentBrowser.dll')
            if (-not ($process.ExitCode -eq 3 -and $saved -and $knownCrash)) {
              throw "Unreal Ocean Serenity import failed with unexpected exit $($process.ExitCode)"
            }
            Write-Warning 'Known UE 5.7 post-save Content Browser assertion detected; mesh file exists. Continuing to cook for asset validation.'
          }
          Write-Host "Ocean Serenity skeletal mesh asset exists: $mesh"
      - name: Build and package Android APK
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $output = Join-Path $env:GITHUB_WORKSPACE 'unreal\PackagedAndroid'
          if (!(Test-Path $project)) { throw "Unreal project not found: $project" }
          & $uat BuildCookRun -project="$project" -noP4 -platform=Android -clientconfig=Development -nocompileeditor -unattended -build -cook -stage -pak -package -archive -archivedirectory="$output" -utf8output
          if ($LASTEXITCODE -ne 0) { throw "Unreal BuildCookRun failed with exit code $LASTEXITCODE" }
      - name: Preserve Unreal build logs on failure
        if: failure()
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'unreal-build-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $root = Join-Path $env:APPDATA 'Unreal Engine\AutomationTool\Logs'
          if (Test-Path $root) {
            Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.txt', '.log') } | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart([char]92)
              $destination = Join-Path $diagnostics $relative
              New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload Unreal diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Build-Logs
          path: unreal-build-diagnostics/**
          if-no-files-found: warn
      - name: Verify APK exists
        shell: powershell
        run: |
          $apks = @(Get-ChildItem -Path 'unreal\PackagedAndroid' -Filter '*.apk' -Recurse -ErrorAction SilentlyContinue)
          if ($apks.Count -eq 0) { throw 'No APK was produced.' }
          $apks | ForEach-Object { Write-Host $_.FullName }
      - name: Check GitHub artifact storage DNS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($hostName in @('results-receiver.actions.githubusercontent.com', 'productionresultssa13.blob.core.windows.net')) {
            $resolved = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $addresses = [System.Net.Dns]::GetHostAddresses($hostName)
                if ($addresses.Count -gt 0) {
                  Write-Host "$hostName resolves to $($addresses[0])"
                  $resolved = $true
                  break
                }
              } catch {
                Write-Warning "DNS attempt $attempt for $hostName failed: $_"
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $resolved) { Write-Warning "DNS still unavailable for $hostName; artifact upload may fail. Check runner DNS, firewall, and proxy." }
          }
      - name: Upload Android APK
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Android-APK
          path: unreal/PackagedAndroid/**/*.apk
          if-no-files-found: error
      - name: Retry Android APK upload after network failure
        if: steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: MindControl-Unreal-Android-APK-Retry
          path: unreal/PackagedAndroid/**/*.apk
          if-no-files-found: error
