name: Unreal Engine 5.7 Android APK
on:
  workflow_dispatch:
  push:
    branches: [unreal5-prototype]
    paths:
      - 'unreal/**'
      - '.github/workflows/unreal-android.yml'
jobs:
  package-android:
    runs-on: [self-hosted, Windows, X64, unreal-5-7, android-sdk]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unreal 5.7 and Android toolchain
        shell: powershell
        run: |
          $engine = "C:\Users\82gts\Epic Games\UE_5.7"
          $uat = Join-Path $engine 'Engine\Build\BatchFiles\RunUAT.bat'
          if (!(Test-Path $uat)) { throw "Unreal Engine not found at $engine. Set UE_ROOT as a system environment variable and restart the runner service." }
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          if (!(Test-Path $sdk)) { throw "Android SDK not found at $sdk. Set ANDROID_HOME as a system environment variable accessible to the runner service." }
          "UE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Unreal Engine: $engine"
          Write-Host "Android SDK: $sdk"
      - name: Clear stale project build metadata
        shell: powershell
        run: |
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE 'unreal'
          foreach ($folder in @('Intermediate', 'Binaries', 'PackagedAndroid')) {
            $target = Join-Path $projectRoot $folder
            if (Test-Path $target) {
              Write-Host "Removing generated project folder: $target"
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
            }
          }
      - name: Build Windows editor target for cooking
        shell: powershell
        run: |
          $build = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          & $build MindControlEditor Win64 Development "-Project=$project" -WaitMutex -NoHotReload
          if ($LASTEXITCODE -ne 0) { throw "MindControlEditor build failed with exit code $LASTEXITCODE" }
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'unreal\Binaries\Win64\MindControlEditor.target'
          if (!(Test-Path $receipt)) { throw "Editor target receipt missing: $receipt" }
      - name: Build and package Android APK
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal\MindControl.uproject'
          $output = Join-Path $env:GITHUB_WORKSPACE 'unreal\PackagedAndroid'
          if (!(Test-Path $project)) { throw "Unreal project not found: $project" }
          & $uat BuildCookRun -project="$project" -noP4 -platform=Android -clientconfig=Development -nocompileeditor -unattended -build -cook -stage -pak -package -archive -archivedirectory="$output" -utf8output
          if ($LASTEXITCODE -ne 0) { throw "Unreal BuildCookRun failed with exit code $LASTEXITCODE" }
      - name: Collect Android native debug symbols
        if: success()
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'unreal'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'unreal-android-symbols'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $sources = @('Binaries\\Android', 'Intermediate\\Android', 'PackagedAndroid')
          $found = 0
          foreach ($source in $sources) {
            $folder = Join-Path $root $source
            if (!(Test-Path $folder)) { continue }
            Get-ChildItem -LiteralPath $folder -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '\\.(so|sym|debug|symbols)
        if: failure()
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'unreal-build-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $root = Join-Path $env:APPDATA 'Unreal Engine\AutomationTool\Logs'
          if (Test-Path $root) {
            Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.txt', '.log') } | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart('\')
              $destination = Join-Path $diagnostics $relative
              New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload Unreal diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MindControl-Unreal-Build-Logs
          path: unreal-build-diagnostics/**
          if-no-files-found: warn
      - name: Verify APK exists
        shell: powershell
        run: |
          $apks = @(Get-ChildItem -Path 'unreal\PackagedAndroid' -Filter '*.apk' -Recurse -ErrorAction SilentlyContinue)
          if ($apks.Count -eq 0) { throw 'No APK was produced.' }
          $apks | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MindControl-Unreal-Android-APK
          path: unreal/PackagedAndroid/**/*.apk
          if-no-files-found: error
