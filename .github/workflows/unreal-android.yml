              }
          }
          if ($found -eq 0) { Write-Warning 'No native symbol files found; Android packaging may be stripping them.' }
      - name: Upload Android native debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MindControl-Android-Debug-Symbols
          path: unreal-android-symbols/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Unreal build logs on failure
        if: failure()
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'unreal-build-diagnostics'
